[server]
host-name=axis-speaker
use-ipv4=yes
use-ipv6=no
allow-interfaces=@IFACE@
disallow-other-stacks=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
publish-aaaa-on-ipv4=no

[reflector]
enable-reflector=no
